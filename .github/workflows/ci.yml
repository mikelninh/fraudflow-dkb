name: prove

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build OS contract
        run: python scripts/check_build_os.py
      - name: Tests
        run: pytest -q
      - name: Behavioural evals
        run: python evals/run_evals.py --check
      - name: Build GitHub Pages artifact
        run: python scripts/build_pages.py
      - name: Verify Pages artifact
        run: test -f dist/index.html && test -f dist/demo/scenario.json && test -f dist/demo/proof.json
      - name: Compile check
        run: python -m compileall -q app evals scripts
